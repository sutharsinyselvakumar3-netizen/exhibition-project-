name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_FULL=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java full version: $JAVA_FULL"
          if [ -z "$JAVA_FULL" ]; then
            echo "Error: Could not detect active Java version."
            exit 1
          fi
          JAVA_MAJOR=$(echo "$JAVA_FULL" | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not parse active Java major version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java environment verified: Java $JAVA_MAJOR is active (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected APK $TARGET_APK not found!"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: $TARGET_APK is empty."
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "Error: $TARGET_APK does not have .apk extension."; exit 1 ;;
          esac
          echo "APK verified successfully: $TARGET_APK ($(du -h "$TARGET_APK" | cut -f1))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_DIR="${{ runner.temp }}/apk-release-asset"
          mkdir -p "$TEMP_DIR"
          RAW_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_NAME" ]; then
            RAW_NAME="ai-agri-robot"
          fi
          SAFE_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          ASSET_NAME="${SAFE_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"
          cp "$SOURCE_APK" "$ASSET_PATH"
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $ASSET_PATH."
            exit 1
          fi
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Release asset prepared at: $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH does not exist or is empty."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Asset does not have .apk extension."; exit 1 ;;
          esac
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES=$(cat <<EOF
          ### AI AGRI ROBOT - Automated Debug APK Build

          * **Build Type:** Automatically generated debug APK
          * **Built By:** GitHub Actions
          * **Workflow Run Number:** #${{ github.run_number }}
          * **Workflow Run Attempt:** #${{ github.run_attempt }}
          * **Source Commit SHA:** \`${{ github.sha }}\`
          * **Target Branch:** \`${{ github.ref_name }}\`
          * **Intended Use:** Field testing, sensor verification, and robot debugging
          * **Important Notice:** This is NOT a Play Store production release. It is signed only with a temporary debug keystore for development and testing.
          EOF
          )
          echo "Creating GitHub Release with tag: $TAG"
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=========================================="
            echo "GitHub Release published successfully!"
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "APK Asset Filename: $ASSET_NAME"
            RELEASE_URL=""
            if gh release view "$TAG" > /dev/null 2>&1; then
              RELEASE_URL=$(gh release view "$TAG" --json url -q .url 2>/dev/null || echo "")
            fi
            if [ -z "$RELEASE_URL" ]; then
              RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
            fi
            echo "Direct Release Page: $RELEASE_URL"
            echo "=========================================="
            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **Debug APK built successfully** and published to GitHub Releases!"
              echo ""
              echo "* **Release Title:** $TITLE"
              echo "* **Release Tag:** \`$TAG\`"
              echo "* **Direct Download Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo "* **Release APK Filename:** \`$ASSET_NAME\`"
              echo ""
              echo "📱 **Download Instructions:** Open the release link above on your Android phone and download \`$ASSET_NAME\` directly under the **Assets** section."
              echo ""
              echo "📦 **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=========================================="
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "The debug APK was built successfully."
            echo "The standard GitHub Actions artifact named 'app-debug-apk' remains available."
            echo "=========================================="
            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "✅ **Debug APK built successfully!**"
              echo ""
              echo "⚠️ GitHub Release creation did not complete (check repository permissions or release status)."
              echo ""
              echo "📦 **Download from Artifacts:** The debug APK has been safely uploaded and is available for download under the workflow run artifacts as \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
